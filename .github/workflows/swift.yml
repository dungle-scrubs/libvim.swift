# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: test (local macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    # Swift build/tests of a macOS package: self-hosted runner on mini
    # (ticket #1). GitHub-hosted macOS runners bill at 10x the Linux rate.
    runs-on: [self-hosted, macos]

    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.10"
    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
